<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rack Room Monitoring</title>
    <link rel="stylesheet" href="style.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
    <script type="module" src="app.js"></script>
</head>

<body>
    <header>
        <h1>RACK ROOM MONITORING SYSTEM</h1>
        <p>
            Temperature & Humidity Monitoring
        </p>
    </header>
    <main>
        <!-- ========================================= -->
        <!-- CONNECTION STATUS -->
        <!-- ========================================= -->
        <section class="status-section">
            <div>
                <span id="connectionDot" class="dot offline">
                </span>
                <span id="connectionText">
                    กำลังเชื่อมต่อ...
                </span>
            </div>
            <div>
                Last Update:
                <span id="lastUpdate">
                    -
                </span>
            </div>
        </section>
        <!-- ========================================= -->
        <!-- CURRENT VALUE -->
        <!-- ========================================= -->
        <section class="cards">
            <!-- Temperature -->
            <div id="temperatureCard" class="card status-good">
                <div class="card-header">
                    <span class="card-title">Temperature</span>
                </div>
                <div class="card-body">
                    <div class="status-box">
                        <span class="status-label">Status:</span>
                        <span id="temperatureStatus" class="status-value">GOOD</span>
                    </div>
                    <div class="value-box">
                        <span id="temperature" class="number">--</span>
                        <span class="unit">°C</span>
                    </div>
                </div>
            </div>

            <!-- Humidity -->
            <div id="humidityCard" class="card status-good">
                <div class="card-header">
                    <span class="card-title">Humidity</span>
                </div>
                <div class="card-body">
                    <div class="status-box">
                        <span class="status-label">Status:</span>
                        <span id="humidityStatus" class="status-value">GOOD</span>
                    </div>
                    <div class="value-box">
                        <span id="humidity" class="number">--</span>
                        <span class="unit">%RH</span>
                    </div>
                </div>
            </div>
        </section>
        <!-- ========================================= -->
        <!-- TEMPERATURE GRAPH -->
        <!-- ========================================= -->
        <section class="panel">
            <h2>
                🌡️ Temperature History
            </h2>
            <div class="chart-container">
                <canvas id="temperatureChart"></canvas>
            </div>
        </section>
        <!-- ========================================= -->
        <!-- HUMIDITY GRAPH -->
        <!-- ========================================= -->
        <section class="panel">
            <h2>
                💧 Humidity History
            </h2>
            <div class="chart-container">

                <canvas id="humidityChart"></canvas>
            </div>
        </section>
        <!-- Measurement History -->
        <section class="panel">
            <h2>📋 Measurement History</h2>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Time</th>
                            <th>Temperature</th>
                            <th>Humidity</th>
                        </tr>
                    </thead>
                    <tbody id="historyTable">
                        <tr>
                            <td colspan="4">
                                Waiting for data...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
        <section class="panel">
            <h2>📥 Download Data</h2>
            <div class="download-buttons">
                <button id="downloadAll">
                    📊 Download All Data
                </button>
            </div>
        </section>
    </main>
    <footer>

    </footer>
    <!-- JavaScript -->

    <script type="module" src="app.js">
    </script>
</body>

</html>
